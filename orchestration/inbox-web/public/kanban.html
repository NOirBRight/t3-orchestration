<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inbox</title>
  <!-- 看板已并进 Inbox 的“进度”tab（P109）；旧链接带着 Campaign 和机器转过去。 -->
  <script>(function(){var from=new URL(location.href),to=new URL('./',from);['campaign','machine'].forEach(function(k){var v=from.searchParams.get(k);if(v)to.searchParams.set(k,v)});to.searchParams.set('tab','progress');location.replace(to.href)})();</script>
</head>
<body><a href="./?tab=progress">Inbox</a></body>
</html>
